<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FilmFlow — карточка</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="title">
<header>
  <div class="container">
    <div class="topbar">
      <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>

      <nav>
        <a class="navlink" data-nav="home" href="index.html">Главная</a>
        <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
        <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
        <a class="navlink" data-nav="profile" href="profile.html">Профиль</a>
      </nav>

      <div class="spacer"></div>

      <div class="row" style="gap:10px">
        <div class="avatar" id="navAvatar">Г</div>
        <div class="small"><span id="navName">Гость</span></div>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <section class="panel">
    <div class="panel-head">
      <strong id="tTitle">—</strong>
      <span class="tag" id="tMeta">—</span>
      <span class="rating" id="tRating">—</span>
    </div>
    <div class="panel-body">
      <div class="row" id="tTags"></div>
      <p class="muted" id="tDesc" style="line-height:1.6"></p>

      <div class="row" style="margin-top:12px">
        <button class="pill accent" id="btnWatch" type="button">▶ Смотреть</button>
        <button class="pill" id="btnContinueSeries" type="button" style="display:none">Продолжить сериал</button>
        <button class="pill" id="btnFav" type="button">❤ В избранное</button>
        <button class="pill" id="btnWL" type="button">🕒 Смотреть позже</button>
        <a class="pill" href="catalog.html">← Назад в каталог</a>
      </div>

      <div id="epHint" class="small" style="margin-top:10px; display:none">
        Если это сериал — выбери сезон и серию ниже, затем нажми “Смотреть”.
      </div>

      <hr/>

      <div class="row" id="seasonsBox" style="display:none; gap:10px"></div>
      <div class="list" id="episodesBox" style="display:none; margin-top:12px"></div>
    </div>
  </section>

  <footer>
    <div class="small">
      Карточка контента FilmFlow. Для сериалов: сезоны/серии доступны ниже.
    </div>
  </footer>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>

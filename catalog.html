<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FilmFlow — каталог</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="catalog">
<header>
  <div class="container">
    <div class="topbar">
      <a class="logo" href="index.html"><span class="logo-badge">F</span> FilmFlow</a>

      <nav>
        <a class="navlink" data-nav="home" href="index.html">Главная</a>
        <a class="navlink" data-nav="catalog" href="catalog.html">Каталог</a>
        <a class="navlink" data-nav="watch" href="watch.html">Смотреть</a>
        <a class="navlink" data-nav="profile" href="profile.html">Профиль</a>
      </nav>

      <div class="spacer"></div>

      <div class="search">
        🔎 <input id="q" type="search" placeholder="Поиск: название, жанр, страна…" autocomplete="off" />
      </div>

      <div class="row" style="gap:10px">
        <div class="avatar" id="navAvatar">Г</div>
        <div class="small"><span id="navName">Гость</span></div>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <section>
    <h2>Каталог</h2>

    <div class="panel">
      <div class="panel-head">
        <strong>Фильтры</strong>
        <span id="count" class="small"></span>
      </div>
      <div class="panel-body">
        <div class="filters-grid">
          <div class="field">
            <label for="fGenre">Жанр</label>
            <select id="fGenre"><option value="">Любой</option></select>
          </div>
          <div class="field">
            <label for="fCountry">Страна</label>
            <select id="fCountry"><option value="">Любая</option></select>
          </div>
          <div class="field">
            <label for="fAge">Возраст</label>
            <select id="fAge">
              <option value="">Любой</option>
              <option value="0+">0+</option>
              <option value="6+">6+</option>
              <option value="12+">12+</option>
              <option value="16+">16+</option>
              <option value="18+">18+</option>
            </select>
          </div>
          <div class="field">
            <label for="fSort">Сортировка</label>
            <select id="fSort">
              <option value="pop">По популярности</option>
              <option value="rating">По рейтингу</option>
              <option value="new">Сначала новые</option>
            </select>
          </div>

          <div class="field">
            <label for="fYearMin">Год от</label>
            <input id="fYearMin" type="number" min="1950" max="2030" placeholder="например 2015" />
          </div>
          <div class="field">
            <label for="fYearMax">Год до</label>
            <input id="fYearMax" type="number" min="1950" max="2030" placeholder="например 2026" />
          </div>
          <div class="field">
            <label for="fRatingMin">Рейтинг от</label>
            <input id="fRatingMin" type="number" min="0" max="10" step="0.1" placeholder="например 7.0" />
          </div>
        </div>

        <div class="row" style="margin-top:12px">
          <button class="pill accent" id="btnApply" type="button">Применить</button>
          <button class="pill" id="btnReset" type="button">Сбросить</button>
          <span class="small">Нажми на карточку, чтобы открыть подробности.</span>
        </div>
      </div>
    </div>

    <div style="height:14px"></div>
    <div id="grid" class="grid"></div>
  </section>

  <footer>
    <div class="small">FilmFlow — каталог фильмов и сериалов (прототип).</div>
  </footer>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
